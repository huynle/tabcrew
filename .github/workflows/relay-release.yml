name: Relay release

# Builds and publishes the TabCrew Online relay image (ghcr.io/huynle/tabcrew-relay) through the
# organization's reviewed release workflow, after the relay's tests and an image smoke test pass.
# Production promotion is manual: a reviewed huynle/infra PR pins the exact tag and digest
# (apps/homelab/tabcrew-relay). This repository is public, so builds run on GitHub-hosted runners only.
on:
  push:
    branches: [main]
    paths:
      - relay/**
      - daemon/**
      - shared/**
      - package.json
      - package-lock.json
      - .github/workflows/relay-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w shared && npm run build -w daemon && npm run build -w relay
      - run: npm test -w @tabcrew/daemon
      - run: npm test -w @tabcrew/relay

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          load: true
          tags: tabcrew-relay:smoke
      - name: Starts and answers /healthz
        run: |
          docker run -d --name relay -p 8790:8790 \
            -e RELAY_PUBLIC_URL=http://127.0.0.1:8790 -e RELAY_STORE=memory \
            -e RELAY_SIGNING_KEY="$(openssl rand -hex 32)" \
            -e GITHUB_CLIENT_ID=smoke -e GITHUB_CLIENT_SECRET=smoke tabcrew-relay:smoke
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8790/healthz && exit 0; sleep 1; done
          docker logs relay; exit 1

  release:
    needs: [test, image]
    permissions:
      contents: read
      packages: write
    uses: huynle/.github/.github/workflows/container-release.yml@v1
    with:
      image: ghcr.io/huynle/tabcrew-relay
      context: .
      dockerfile: relay/Dockerfile
      runner: ubuntu-latest

  summary:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "image:  ghcr.io/huynle/tabcrew-relay:${{ needs.release.outputs.git-tag }}"
          echo "digest: ${{ needs.release.outputs.digest }}"
