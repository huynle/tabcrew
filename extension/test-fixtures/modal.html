<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Modal fixture</title>
    <!--
      Scroll-area fixture for extension/scripts/page-check.ts (headless Chrome) and for live checks
      with TabCrew. A long page sits behind an open modal dialog ("Provider settings") whose body
      scrolls (max-height) and whose "Preview sync" button starts below the dialog's fold. While the
      dialog is open the page's scroll is locked (body overflow hidden). The dialog body ends in a
      sticky note that covers the bottom of the visible area. Closing the dialog unlocks the page,
      which also has a scrollable "Activity" side panel. ?closed=1 starts with the dialog closed.
    -->
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; }
      body.locked { overflow: hidden; }
      main { padding: 16px; width: 520px; }
      main section { height: 220px; border-bottom: 1px solid #ddd; }
      #activity { position: fixed; right: 16px; top: 16px; width: 260px; height: 300px; overflow-y: auto; border: 1px solid #999; }
      #activity li { height: 40px; }
      #backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 40%); z-index: 10; }
      #dialog {
        position: fixed; z-index: 11; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 460px; background: white; border-radius: 8px; display: flex; flex-direction: column;
      }
      #dialog header, #dialog footer { padding: 10px 16px; }
      #dialog .body { max-height: 320px; overflow-y: auto; padding: 0 16px; }
      #dialog label { display: block; margin: 14px 0; }
      #dialog input { width: 300px; }
      #dialog .note { position: sticky; bottom: 0; height: 56px; background: #ffd; margin: 0 -16px; padding: 4px 16px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body class="locked">
    <main>
      <h1>Integrations</h1>
      <button type="button" id="open">Open provider settings</button>
      <section><p>Background section one</p><button type="button">Background action one</button></section>
      <section><p>Background section two</p><button type="button">Background action two</button></section>
      <section><p>Background section three</p><button type="button">Background action three</button></section>
      <section><p>Background section four</p><button type="button">Background action four</button></section>
      <section><p>Background section five</p><button type="button">Background action five</button></section>
      <section><p>Background bottom</p><button type="button">Background bottom action</button></section>
    </main>
    <aside id="activity" aria-label="Activity">
      <ul></ul>
    </aside>
    <div id="backdrop"></div>
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <header><h2 id="dialog-title">Provider settings</h2></header>
      <div class="body">
        <label>Provider name <input name="name" value="canis-ai" /></label>
        <label>Base URL <input name="url" value="https://llm.example/v1" /></label>
        <label>Model <input name="model" /></label>
        <label>Organisation <input name="org" /></label>
        <label>Project <input name="project" /></label>
        <label>Region <input name="region" /></label>
        <label>Timeout (s) <input name="timeout" /></label>
        <label>Retries <input name="retries" /></label>
        <label>Proxy <input name="proxy" /></label>
        <label>Notes <input name="notes" /></label>
        <p><button type="button" id="preview">Preview sync</button></p>
        <p id="result" role="status"></p>
        <div class="note">Changes are saved when you press Save.</div>
      </div>
      <footer><button type="button" id="cancel">Cancel</button> <button type="button" id="save">Save</button></footer>
    </div>
    <script>
      const $ = (sel) => document.querySelector(sel);
      $("#activity ul").innerHTML = Array.from({ length: 20 }, (_, i) => `<li><a href="#a${i + 1}">Activity item ${i + 1}</a></li>`).join("");
      const setOpen = (open) => {
        $("#dialog").hidden = !open;
        $("#backdrop").hidden = !open;
        document.body.classList.toggle("locked", open);
      };
      $("#preview").addEventListener("click", () => ($("#result").textContent = "Preview ready: 3 models"));
      $("#cancel").addEventListener("click", () => setOpen(false));
      $("#save").addEventListener("click", () => setOpen(false));
      $("#open").addEventListener("click", () => setOpen(true));
      if (new URLSearchParams(location.search).has("closed")) setOpen(false);
    </script>
  </body>
</html>
